<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="3" />
  
  <!-- Left bracket < -->
  <path d="M 18 24 L 11 32 L 18 40" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right bracket > -->
  <path d="M 46 24 L 53 32 L 46 40" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- MA Center Monogram -->
  <text x="32" y="38" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="1">MA</text>
  
  <!-- Active Green Status Dot -->
  <circle cx="48" cy="15" r="3.5" fill="#10b981" />
</svg>